# 导航审查 · 固定滞后平滑器 —— Compose 编排
#
# 日常启动（主机端口可用 PORT 环境变量配置，默认 8080）：
#   docker compose up app
#   PORT=9090 docker compose up app
#
# 执行一次性验收服务（代码测试 → 构建检查 → 健康/业务 API 冒烟，随后退出）：
#   docker compose --profile verify run --rm verify
#
# verify 会在容器内自启临时实例完成全流程冒烟，并对已运行的 app 服务
# （http://app:8080）追加健康与业务路径冒烟；退出码即验收结论。

services:
  app:
    build: .
    image: nav-review:latest
    environment:
      NAV_HOST: 0.0.0.0
      NAV_PORT: 8080
      NAV_STORE: /data/state.json
    ports:
      # 主机端口可配置：PORT=9090 docker compose up app
      - "${PORT:-8080}:8080"
    volumes:
      - nav-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  verify:
    profiles: ["verify"]
    image: nav-review:latest
    build: .
    command: ["python3", "scripts/verify", "--base-url", "http://app:8080"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      NAV_STORE: /tmp/verify-state.json

volumes:
  nav-data:
